name: CrossLedger AI Organism

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual improvement run'

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-organism:
    runs-on: ubuntu-latest
    name: Run AI Improvement Agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4.3.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run AI Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
        run: node scripts/run-ai-agent.mjs

      - name: Commit improvements to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "CrossLedger AI Agent"
          git config --global user.email "ai-agent@crossledger.trade"
          # Stage generated/patched files
          git add ai-improvements.json agent-output.txt || true
          git add pages/_document.js pages/index.js public/sitemap.xml || true
          # Only proceed if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # Commit our changes first (index must be clean before rebase)
          DATESTAMP=$(date -u +%Y-%m-%d-%H%M)
          git commit -m "AI improvements for $DATESTAMP"
          # Now pull with rebase - index is clean so this works
          if ! git pull --rebase origin main; then
            echo "Rebase failed - aborting and using force push"
            git rebase --abort || true
            git push --force-with-lease origin main
          else
            git push origin main
          fi
          echo "Changes pushed to main"
      - name: Summary
        run: |
          echo "## AI Organism Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "Live patches applied: _document.js, index.js, sitemap.xml" >> $GITHUB_STEP_SUMMARY
          echo "Changes pushed directly to main." >> $GITHUB_STEP_SUMMARY
