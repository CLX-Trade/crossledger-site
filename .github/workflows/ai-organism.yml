name: CrossLedger AI Organism

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 14 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual improvement run'

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-organism:
    runs-on: ubuntu-latest
    name: Run AI Improvement Agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run AI Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_RPC_URL: ${{ secrets.NEXT_PUBLIC_RPC_URL }}
        run: node scripts/run-ai-agent.mjs

      - name: Commit improvements directly to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "CrossLedger AI Agent"
          git config --global user.email "ai-agent@crossledger.trade"
          git stash --include-untracked || true
          git pull --rebase origin main
          git stash pop || true
          git add ai-improvements.json agent-output.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "AI improvements for $(date -u +%Y-%m-%d-%H%M)"
            git push origin main
            echo "Changes pushed directly to main"
          fi

      - name: Summary
        run: |
          echo "## AI Organism Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "Changes pushed directly to main." >> $GITHUB_STEP_SUMMARY
